modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 软依赖：Beyond Dimensions 自定义合成（beyonddimensions + kubejs 齐备时生效）
[[dependencies.${mod_id}]]
    modId="beyonddimensions"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kubejs"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# 软依赖：Curios / Iron's Spells / Time in a Bottle（缺失时静默跳过对应功能）
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tiab"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# 软依赖：净化增幅第三方词条剥离（缺失时静默降级）
[[dependencies.${mod_id}]]
    modId="infernalmobs"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="l2hostility"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="wenxingtools.mixins.json"
